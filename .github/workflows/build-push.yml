name: Build and push

on:
  push:
    branches: [main]

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: ap-south-1
  ROLE_ARN: arn:aws:iam::388260576890:role/devops-final-github-ecr-push

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            context: .
            file: Dockerfile
          - name: backend
            context: backend
            file: backend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Assume AWS role (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        id: login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        run: |
          docker build \
            -t ${{ steps.login.outputs.registry }}/devops-final/${{ matrix.name }}:${{ github.sha }} \
            -f ${{ matrix.file }} ${{ matrix.context }}

      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ steps.login.outputs.registry }}/devops-final/${{ matrix.name }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Push image
        run: docker push ${{ steps.login.outputs.registry }}/devops-final/${{ matrix.name }}:${{ github.sha }}

          deploy-review:
    needs: build-and-push
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, backend]
    steps:
      - name: Assume AWS role (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::388260576890:role/devops-final-review-github-deploy
          aws-region: ap-south-1

      - name: Deploy ${{ matrix.service }} to review
        env:
          CLUSTER: devops-final-review-cluster
          SERVICE: devops-final-review-${{ matrix.service }}
          IMAGE: 388260576890.dkr.ecr.ap-south-1.amazonaws.com/devops-final/${{ matrix.service }}:${{ github.sha }}
        run: |
          set -euo pipefail
          aws ecs describe-task-definition --task-definition "$SERVICE" --query taskDefinition > td.json
          jq --arg IMAGE "$IMAGE" '.containerDefinitions[0].image = $IMAGE
            | del(.taskDefinitionArn, .revision, .status, .requiresAttributes, .compatibilities, .registeredAt, .registeredBy)' td.json > new-td.json
          NEW_ARN=$(aws ecs register-task-definition --cli-input-json file://new-td.json --query taskDefinition.taskDefinitionArn --output text)
          echo "Registered $NEW_ARN"
          aws ecs update-service --cluster "$CLUSTER" --service "$SERVICE" --task-definition "$NEW_ARN" > /dev/null
          aws ecs wait services-stable --cluster "$CLUSTER" --services "$SERVICE"
          echo "$SERVICE is stable"