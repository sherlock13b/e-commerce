name: PR checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: backend

      - name: Unit tests
        run: npm test
        working-directory: backend

  build-and-scan:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: frontend
            context: .
            file: Dockerfile
          - name: backend
            context: backend
            file: backend/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t ecommerce-${{ matrix.name }}:pr -f ${{ matrix.file }} ${{ matrix.context }}

      - name: Trivy scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ecommerce-${{ matrix.name }}:pr
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"